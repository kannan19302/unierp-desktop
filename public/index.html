<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniERP Desktop</title>
  <!-- The palette is GENERATED from the design system, not written here.
       This shell used to declare its own — #0b0f19 / #38bdf8 and a two-hue
       accent gradient — which made it a fourth colour system for one product,
       matching no shipped theme and unable to follow any token change. It has
       no bundler, so the tokens are generated into this directory instead of
       imported; `pnpm build` in unierp-design-system fails if the two drift.
       See scripts/generate-cross-platform-tokens.mjs. -->
  <link rel="stylesheet" href="./tokens.g.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg-base);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .titlebar {
      display: flex; align-items: center; justify-content: center;
      padding: 0.5rem; background: var(--bg-elevated); border-bottom: 1px solid var(--border);
      font-size: 0.78rem; color: var(--text-muted); user-select: none;
    }
    .center { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .card {
      background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 2rem; width: min(420px, 100%);
      text-align: center;
    }
    .brand-icon {
      width: 48px; height: 48px;
      display: flex; align-items: center; justify-content: center; color: var(--on-accent);
      font-weight: 800; margin: 0 auto 1rem;
    }
    h1 { font-size: 1.3rem; margin-bottom: 0.4rem; }
    p.sub { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
    button {
      width: 100%; padding: 0.75rem; border: 0; border-radius: 8px;
      background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 0.9rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); margin-top: 0.75rem; }
    .error { background: var(--danger-bg); border: 1px solid var(--danger); color: var(--danger-text);
      padding: 0.6rem 0.8rem; border-radius: 8px; font-size: 0.82rem; margin-bottom: 1rem; text-align: left; }
    .app-shell { display: none; flex: 1; flex-direction: column; padding: 2rem; }
    .app-shell.visible { display: flex; }
    .center.hidden { display: none; }
    .app-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
    .app-header h2 { font-size: 1.2rem; }
    .app-header .user { font-size: 0.8rem; color: var(--text-muted); }
    #signOutBtn { width: auto; padding: 0.4rem 0.9rem; font-size: 0.78rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
    .tile {
      background: var(--bg-surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 1.25rem; text-align: left; cursor: pointer; color: var(--text);
    }
    .tile:hover { border-color: var(--accent); background: var(--bg-elevated); }
    .tile.disabled { opacity: 0.55; cursor: not-allowed; }
    .tile .name { font-weight: 700; margin-bottom: 0.25rem; }
    .tile .code { font-size: 0.72rem; color: var(--text-muted); font-family: monospace; }
    .empty { color: var(--text-muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="titlebar">UniERP Desktop (Platform 10)</div>

  <div class="center" id="loginView">
    <div class="card">
      <div class="brand-icon">
        <svg width="48" height="48" viewBox="0 0 32 32" fill="none" aria-label="UniERP">
          <path d="M4 5.5 16 1l12 4.5v9.7c0 7.2-4.8 12.5-12 15.8C8.8 27.7 4 22.4 4 15.2V5.5Z" fill="var(--accent)"/>
          <path d="M10 9v7.2c0 4 2.2 6.1 6 6.1s6-2.1 6-6.1V9h-3.7v7c0 2.1-.7 3.1-2.3 3.1s-2.3-1-2.3-3.1V9H10Z" fill="var(--bg-surface)"/>
        </svg>
      </div>
      <h1>Sign in to UniERP</h1>
      <p class="sub">One account for every UniERP platform.</p>
      <div id="loginError" class="error" style="display:none;"></div>
      <button id="signInBtn">Sign in with UniERP Account</button>
    </div>
  </div>

  <div class="app-shell" id="appView">
    <div class="app-header">
      <h2>Your platforms</h2>
      <div class="user">
        <span id="userLabel"></span>
        <button id="accountBtn" class="secondary">Account</button>
        <button id="signOutBtn" class="secondary">Sign out</button>
      </div>
    </div>
    <div id="platformGrid" class="grid"></div>
  </div>

  <script src="oidc.js"></script>
  <script src="app.js"></script>
</body>
</html>
