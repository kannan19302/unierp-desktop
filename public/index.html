<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniERP Desktop</title>
  <style>
    :root {
      --bg-base: #0b0f19;
      --bg-surface: #111827;
      --bg-elevated: #1e293b;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --accent-grad: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg-base);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .titlebar {
      display: flex; align-items: center; justify-content: center;
      padding: 0.5rem; background: #070a10; border-bottom: 1px solid var(--border);
      font-size: 0.78rem; color: var(--text-muted); user-select: none;
    }
    .center { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .card {
      background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 2rem; width: min(420px, 100%);
      text-align: center;
    }
    .brand-icon {
      width: 48px; height: 48px; border-radius: 10px; background: var(--accent-grad);
      display: flex; align-items: center; justify-content: center; color: #fff;
      font-weight: 800; margin: 0 auto 1rem;
    }
    h1 { font-size: 1.3rem; margin-bottom: 0.4rem; }
    p.sub { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
    button {
      width: 100%; padding: 0.75rem; border: 0; border-radius: 8px;
      background: var(--accent); color: #06131f; font-weight: 700; font-size: 0.9rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); margin-top: 0.75rem; }
    .error { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.4); color: #fca5a5;
      padding: 0.6rem 0.8rem; border-radius: 8px; font-size: 0.82rem; margin-bottom: 1rem; text-align: left; }
    .app-shell { display: none; flex: 1; flex-direction: column; padding: 2rem; }
    .app-shell.visible { display: flex; }
    .center.hidden { display: none; }
    .app-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
    .app-header h2 { font-size: 1.2rem; }
    .app-header .user { font-size: 0.8rem; color: var(--text-muted); }
    #signOutBtn { width: auto; padding: 0.4rem 0.9rem; font-size: 0.78rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
    .tile {
      background: var(--bg-surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 1.25rem; text-align: left; cursor: pointer; color: var(--text);
    }
    .tile:hover { border-color: var(--accent); background: var(--bg-elevated); }
    .tile .name { font-weight: 700; margin-bottom: 0.25rem; }
    .tile .code { font-size: 0.72rem; color: var(--text-muted); font-family: monospace; }
    .empty { color: var(--text-muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="titlebar">UniERP Desktop (Platform 10)</div>

  <div class="center" id="loginView">
    <div class="card">
      <div class="brand-icon">U</div>
      <h1>Sign in to UniERP</h1>
      <p class="sub">One account for every UniERP platform.</p>
      <div id="loginError" class="error" style="display:none;"></div>
      <button id="signInBtn">Sign in with UniERP Account</button>
    </div>
  </div>

  <div class="app-shell" id="appView">
    <div class="app-header">
      <h2>Your platforms</h2>
      <div class="user">
        <span id="userLabel"></span>
        <button id="signOutBtn" class="secondary">Sign out</button>
      </div>
    </div>
    <div id="platformGrid" class="grid"></div>
  </div>

  <script src="oidc.js"></script>
  <script src="app.js"></script>
</body>
</html>
