services:
  desktop-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: desktop-app
    ports:
      - "4010:4010"
    environment:
      - NODE_ENV=development
      - PORT=4010
      - HOST=0.0.0.0
      - API_URL=http://localhost:3001
      - IDP_URL=http://localhost:3005
    volumes:
      - ./public:/app/public
      - ./server.mjs:/app/server.mjs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
